name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.10.2"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create local.properties
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'PRIM_API_KEY=%s\n' "$PRIM_API_KEY" >> local.properties
          printf 'UPDATE_REPOSITORY=%s\n' "$GITHUB_REPOSITORY" >> local.properties

      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"

      - name: Verify release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "Release signing key verified"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Paris-Metro-Game-0.9.2b
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk Paris-Metro-Game-v0.9.2b.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.2b
          name: Paris Metro Game v0.9.2b
          body_path: CHANGELOG_v0.9.2b.txt
          files: Paris-Metro-Game-v0.9.2b.apk
          make_latest: true
