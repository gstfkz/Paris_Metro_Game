name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.10.2"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le runner GitHub possède déjà le SDK Android.
      # On utilise directement son sdkmanager au lieu de
      # android-actions/setup-android.
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable à : $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager trouvé : $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create local.properties
        shell: bash
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: |
          if [ -z "$PRIM_API_KEY" ]; then
            echo "::warning::PRIM_API_KEY n'est pas défini dans les GitHub Secrets."
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'PRIM_API_KEY=%s\n' "$PRIM_API_KEY" >> local.properties

          echo "local.properties créé."

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroGame-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
