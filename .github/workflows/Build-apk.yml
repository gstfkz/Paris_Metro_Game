name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.10.2"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create local.properties
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'PRIM_API_KEY=%s\n' "$PRIM_API_KEY" >> local.properties
          printf 'UPDATE_REPOSITORY=%s\n' "$GITHUB_REPOSITORY" >> local.properties

      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Normalize signing key to PKCS12
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/release.jks" \
            -srcstoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/release-normalized.p12" \
            -deststoretype PKCS12 \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEYSTORE_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt
          test -s "$RUNNER_TEMP/release-normalized.p12"
          echo "Signing key normalized successfully"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-normalized.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # Le PKCS12 normalisé utilise le même mot de passe pour le store et la clé.
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Paris-Metro-Game-0.5b
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
